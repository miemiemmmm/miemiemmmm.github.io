# Link rot is a slow failure, so this runs on every push and again weekly.
# It is deliberately separate from the deploy workflow: a dead link on someone
# else's server should never stop this page from being published.
name: Check links

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check every link in index.html
        run: python3 .github/check_links.py index.html
